[book]
title = "The Arboreal Book"
description = "Building agentic workflows with Arboreal's behavior trees and executive"
language = "en"
text-direction = "ltr"
src = "src"

[output.html]
default-theme = "light"
git-repository-url = "https://github.com/zenful-ai/arboreal"
additional-js = ["mermaid.min.js", "mermaid-init.js"]
additional-css = ["./mdbook-admonish.css"]

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.svgbob]

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`
